<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}个人博客{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container header-content">
            <a href="/" class="logo">Ying's Blog</a>
            <nav class="nav-links">
                <a href="/">首页</a>
                <a href="/refresh" onclick="return confirm('确定要刷新数据吗？')">刷新数据</a>
            </nav>
        </div>
    </header>
    
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; 2024 Ying's Blog | Powered by Feishu Bitable</p>
    </footer>
</body>
</html>
